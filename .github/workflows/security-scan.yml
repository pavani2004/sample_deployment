name: Security & SAST Scan

on:
  push:
    branches: [ "main", "deployment-*" ]
  pull_request:
    branches: [ "main", "deployment-*" ]
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at 00:00 UTC
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: read
  security-events: write # Required to upload SARIF results to GitHub Security tab
  actions: read

jobs:
  # Job 1: Scan for secrets (API keys, tokens, etc.) using Gitleaks
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for complete commit history scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Optional: Set continue-on-error: true if you don't want secret findings to block the build
        # continue-on-error: true

  # Job 2: Static Code Analysis (SAST) using Semgrep
  sast-scan:
    name: Static Code Analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep CI
        run: |
          pip install semgrep
          semgrep scan --sarif --output=semgrep.sarif --config=auto

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always() # Upload results even if vulnerabilities are found

  # Job 3: Container Security Scanning for Docker images
  container-scan:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image (with fallback to NodeJS base image if no Dockerfile exists)
      - name: Build Docker Image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t local-image:${{ github.sha }} .
          else
            echo "No Dockerfile found. Creating a temporary base image for testing scan."
            echo "FROM node:18-alpine" > Dockerfile
            docker build -t local-image:${{ github.sha }} .
          fi

      # Generate a human-readable table/report with Critical, High, Medium, Low severities
      - name: Run Trivy Scan (Human Readable Report)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'local-image:${{ github.sha }}'
          format: 'table'
          output: 'container-security-report.txt'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          vuln-type: 'os,library'

      # Generate SARIF report to integrate with GitHub Repository Security Alerts
      - name: Run Trivy Scan (SARIF Report)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'local-image:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          vuln-type: 'os,library'

      # Upload the human-readable report as a build artifact
      - name: Upload Detailed Vulnerability Report
        uses: actions/upload-artifact@v4
        with:
          name: container-vulnerability-report
          path: container-security-report.txt
        if: always()

      # Upload SARIF file for GitHub Security Alerts tab
      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()

